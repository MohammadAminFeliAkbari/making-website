services:
  postgres:
    image: postgres:16-alpine
    container_name: website-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: website_builder
      POSTGRES_PASSWORD: website_builder
      POSTGRES_DB: website_builder
    ports:
      - "5000:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website_builder -d website_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: website-builder-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: website_builder
      RABBITMQ_DEFAULT_PASS: website_builder
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
